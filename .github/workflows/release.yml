name: Build release artifacts

# A tag or a release builds the two archives and attaches them:
#   dist/voidborn.sdz      the game
#   dist/voidborn_rift.sd7 the map
#
# The build is the same one that runs locally: python3 build_sdz.py compiles
# every Lua file, runs the smoke tests, builds the archive and compares it with
# the sources file by file.  Only the install and the engine check are skipped
# (there is no engine and no games folder on a runner).

on:
  release:
    types: [created]
  push:
    tags: ["v*", "[0-9]*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # needed to attach the archives to the release
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the build needs
        run: |
          python -m pip install --upgrade pip
          pip install lupa numpy pillow
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Only build version-shaped tags (e.g. 1.0 or 1.0.0)
        id: gate
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          TAG="${TAG#v}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Tag '$TAG' is not a version - no archives built."
            echo "match=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the game archive
        if: steps.gate.outputs.match == 'true'
        run: python3 build_sdz.py --no-install --no-engine-check

      - name: Build the map archive
        if: steps.gate.outputs.match == 'true'
        run: |
          python3 tools/build_map.py
          python3 tools/gen_skybox.py
          cd map
          # -ms=off: every file keeps its own stream, so the components of the
          # archive can be read one by one
          7z a -t7z -mx=9 -ms=off ../dist/voidborn_rift.sd7 mapinfo.lua maps > /dev/null

      - name: Package Linux and Windows Standalones
        if: steps.gate.outputs.match == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
          REPO: ${{ github.repository.name }}
          ENGINE_VERSION="2026.09.02" # Match your engine version tag
        run: |
          # ==========================================
          # 1. BUILD LINUX STANDALONE
          # ==========================================
          mkdir -p bundle-linux/spring bundle-linux/maps bundle-linux/games
          cp dist/voidborn.sdz bundle-linux/games/
          cp dist/voidborn_rift.sd7 bundle-linux/maps/
          
          # Copy all three start scripts
          cp Play_Choir_vs_Bot.txt bundle-linux/
          cp Play_Maw_vs_Bot.txt bundle-linux/
          cp Watch_Bot_vs_Bot.txt bundle-linux/
          
          # Download and extract Linux Engine binaries
          wget -q "https://github.com/beyond-all-reason/spring/releases/download/$ENGINE_VERSION/recoil_${ENGINE_VERSION}_amd64-linux.7z" -O engine-linux.7z
          mkdir -p engine-linux-extracted
          7z x engine-linux.7z -oengine-linux-extracted > /dev/null
          cp -r engine-linux-extracted/* bundle-linux/spring/
          
          # Zip Linux package
          cd bundle-linux
          zip -r "../$REPO-standalone-$TAG-linux.zip" .
          cd ..
          
          # ==========================================
          # 2. BUILD WINDOWS STANDALONE
          # ==========================================
          mkdir -p bundle-windows/spring bundle-windows/maps bundle-windows/games
          cp dist/voidborn.sdz bundle-windows/games/
          cp dist/voidborn_rift.sd7 bundle-windows/maps/
          
          # Copy all three start scripts
          cp Play_Choir_vs_Bot.txt bundle-windows/
          cp Play_Maw_vs_Bot.txt bundle-windows/
          cp Watch_Bot_vs_Bot.txt bundle-windows/
          
          # Download and extract Windows Engine binaries
          wget -q "https://github.com/beyond-all-reason/spring/releases/download/$ENGINE_VERSION/recoil_${ENGINE_VERSION}_amd64-windows.7z" -O engine-win.7z
          mkdir -p engine-win-extracted
          7z x engine-win.7z -oengine-win-extracted > /dev/null
          cp -r engine-win-extracted/* bundle-windows/spring/
          
          # Zip Windows package
          cd bundle-windows
          zip -r "../$REPO-standalone-$TAG-windows.zip" .
          cd ..
          
      - name: Make the release if the tag came without one
        if: steps.gate.outputs.match == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          gh release create "$TAG" --title "Voidborn $TAG" --generate-notes --notes-start-tag "$(git tag --sort=-v:refname | sed -n 2p)" || true

      - name: Attach the archives to the release
        if: steps.gate.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.gate.outputs.tag }}
          REPO: ${{ github.repository.name }}
        run: |
          cp dist/voidborn.sdz      "$REPO-$TAG.sdz"
          cp dist/voidborn_rift.sd7 "$REPO-map-$TAG.sd7"
          gh release upload "$TAG" "$REPO-$TAG.sdz" "$REPO-map-$TAG.sd7" --clobber
